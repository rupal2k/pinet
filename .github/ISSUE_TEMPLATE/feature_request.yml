name: Feature request
description: Suggest something new for the device
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: The job you want the device to do, not just the feature.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How you picture it
  - type: textarea
    id: constraints
    attributes:
      label: Anything it must not break?
      description: Power budget, offline operation, the touchscreen layout, etc.
