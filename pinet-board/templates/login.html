<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PINET</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="card login-card">
      <h1><img class="brand-logo brand-logo-lg" src="/static/pinet-logo.png" alt="PINET"></h1>
      <p class="sub">Anonymous message board &amp; file drop for this local network.</p>

      {% if error %}
        <div class="banner error">
          <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="13"></line><line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="post" data-login-form>
        <label for="password">Portal password</label>
        <div class="field">
          <input type="password" id="password" name="password" autocomplete="off" required autofocus>
          <button type="button" class="icon-btn" data-toggle-password="password" aria-label="Show password">
            <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button type="submit">Enter</button>
      </form>

      <p class="footnote">This network has no internet access &mdash; nothing you post here leaves the Pi.</p>
    </div>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
