{# One message row. Rendered both by board.html and by /api/messages,
   so a live-appended message is byte-identical to a reloaded one. #}
<div class="list-item" data-seen-row>
  <div class="item-icon">
    <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
  </div>
  <div class="item-body">
    <div class="msg-text">{{ body }}</div>
    <div class="meta"><time data-ts="{{ created|int }}">{{ created|int|timestamp_str }}</time></div>
  </div>
  {% if is_admin %}
  <form class="fa-del" method="post" action="/delete-message/{{ mid }}" data-confirm="Delete this message? This cannot be undone.">
    <button type="submit" class="fa-btn fa-btn-danger" aria-label="Delete this message">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>
    </button>
  </form>
  {% endif %}
</div>
