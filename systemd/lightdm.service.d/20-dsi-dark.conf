# The desktop (and greeter) is rotated 180 by kanshi, which applies only after
# labwc's first frames, so the panel would flash an unrotated frame right
# after the (already rotated) boot splash. Blank it first; dsi-backlight-enable
# turns it back on once the e-ink dashboard is live. Runs after 10-stagger.
[Service]
ExecStartPre=-/usr/local/bin/dsi-backlight.sh off
