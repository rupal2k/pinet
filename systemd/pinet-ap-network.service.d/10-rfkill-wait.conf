[Service]
# 2026-09-12: this failed at boot with "Operation not possible due to RF-kill"
# -- the onboard wlan0 radio was still rfkilled when the ip commands ran (race
# surfaced after cloud-init was disabled, which used to delay early boot).
# Unblock all radios via sysfs (rfkill CLI isn't installed) and wait for wlan0
# to appear before the IP is assigned.
ExecStartPre=-/bin/sh -c 'for f in /sys/class/rfkill/*/soft; do echo 0 > "$f" 2>/dev/null || true; done'
ExecStartPre=-/bin/sh -c 'for i in $(seq 1 15); do ip link show wlan0 >/dev/null 2>&1 && exit 0; sleep 1; done'
