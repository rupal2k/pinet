[Service]
User=rupal
Group=rupal
PrivateUsers=no
PrivateTmp=no
# raspotify 0.48.3 (apt upgrade, 2026-09-23) makes librespot stream each track
# through a temp file in /tmp. With PrivateTmp=no, the package's
# ProtectSystem=strict leaves /tmp read-only, so every track failed with
# ReadOnlyFilesystem and librespot skipped straight to the next one.
# /tmp is tmpfs (RAM) here, so this adds no SD wear.
ReadWritePaths=/tmp
ProtectHome=no
Environment="XDG_RUNTIME_DIR=/run/user/1000"
Environment="PIPEWIRE_REMOTE=pipewire-0"
Environment="PULSE_SERVER=unix:/run/user/1000/pulse/native"
Environment="LIBRESPOT_BACKEND=pulseaudio"
Environment="LIBRESPOT_ONEVENT=/usr/local/bin/raspotify-nowplaying-hook"
Environment="LIBRESPOT_NAME=PINET"
Environment="LIBRESPOT_VOLUME_CTRL=linear"
Environment="LIBRESPOT_INITIAL_VOLUME=100"
Restart=on-failure
RestartSec=5

[Unit]
StartLimitIntervalSec=0
