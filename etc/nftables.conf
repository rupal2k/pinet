#!/usr/sbin/nft -f
# PINET guard: guests on the PINET hotspot (wlan0) can read its Wi-Fi password
# on the e-ink screen, and rupal has passwordless sudo, so hotspot clients must
# not reach SSH (22) or VNC (5900). Everything else -- the portal (80/443),
# DNS, DHCP, and all access via wlan1/eth0/Pi Connect -- is untouched.

flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy accept;
		iifname "wlan0" tcp dport { 22, 5900 } counter drop
	}
	chain forward {
		type filter hook forward priority filter; policy accept;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
