[dashboard]
# Leave latitude/longitude blank to auto-detect location from your public IP
# (uses http://ip-api.com, no key needed). Set them manually for accuracy/privacy,
# e.g. for London: latitude = 51.5074, longitude = -0.1278
latitude =
longitude =

# How often to redraw the screen, in minutes, while dwelling on one phase.
refresh_minutes = 1

# The screen cycles through four phases, each with its own dwell time in
# seconds: status (CPU/RAM/weather/network), Wi-Fi QR-code, the DOOM logo
# (also shows power/disk health), and the PINET hotspot join screen.
status_seconds = 180
qr_seconds = 30
doom_seconds = 180
hotspot_seconds = 180

# While waiting between refreshes, the network is checked this often (in
# seconds) so a change (cable unplugged, Wi-Fi switched, etc.) triggers an
# immediate screen update instead of waiting for the full interval.
network_poll_seconds = 5

# The Spotify screen's UPS battery icon animates (the fill sweeps up to full
# while charging, blinks when low on battery) with one partial refresh of
# just that icon every this many seconds. 0 = no animation.
battery_anim_seconds = 2

# While a battery is on screen the UPS HAT is read this often (seconds);
# plugging the charger in or pulling it redraws the screen with a partial
# refresh after two readings agree, i.e. within about twice this.
battery_poll_seconds = 2

# The low-voltage/throttled warning on the DOOM screen only appears after
# this many consecutive readings with the live bit set, so a one-off spike
# doesn't flag a healthy supply.
undervoltage_min_readings = 3

# Hours (24h, local time) during which the screen switches to dark mode
# (white icons/text on a black background). Wraps midnight automatically.
# Fractional hours are supported for minute precision, e.g. 17.5 = 5:30 PM.
dark_mode_start_hour = 17.5
dark_mode_end_hour = 5.5

# Set to true if the panel is mounted upside down (e.g. cable exiting the
# top instead of the bottom) to flip the rendered image 180 degrees.
flip_180 = true
